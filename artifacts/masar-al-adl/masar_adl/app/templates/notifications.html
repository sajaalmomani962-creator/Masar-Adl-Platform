{% extends "base.html" %}{% from "_macros.html" import note_list, ico %}{% block title %}الإشعارات{% endblock %}
{% block content %}
<div class="page-head"><div><h1 class="page-title brand">الإشعارات</h1><div class="sub">{% if unread %}{{ unread }} غير مقروءة{% else %}كل الإشعارات مقروءة{% endif %}</div></div>
<form method="post" action="/notifications/read"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="btn btn-sm btn-outline-secondary"{% if not unread %} disabled{% endif %}>{{ ico('check') }}تعليم الكل كمقروء</button></form></div>
<div class="panel"><div class="bd">{{ note_list(notes) }}</div></div>
{% endblock %}
