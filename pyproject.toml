[project]
name = "repl-nix-workspace"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "SAAJAA", email = "sajaalmomani.962@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "arabic-reshaper>=3",
    "argon2-cffi>=23",
    "fastapi>=0.115",
    "httpx>=0.27",
    "itsdangerous>=2.1",
    "jinja2>=3.1",
    "pytest>=8",
    "python-bidi>=0.6",
    "python-multipart>=0.0.9",
    "reportlab>=4.4",
    "replit-object-storage==1.0.2",
    "starlette>=0.37",
    "uvicorn>=0.29",
]

[project.scripts]
repl-nix-workspace = "repl_nix_workspace:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"
